services:
  garment-widget:
    container_name: garment-widget
    image: ${WIDGET_IMAGE:?WIDGET_IMAGE is required}
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_BASE_PATH: ""
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    volumes:
      - ./crucial-context-505515-e1-6275eaef7627.json:/run/secrets/google-service-account.json:ro
      - dashboard-snapshot:/app/.data
    networks:
      - garment-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  dashboard-snapshot:
networks:
  garment-web:
    external: true
    name: plus2opacity_default
